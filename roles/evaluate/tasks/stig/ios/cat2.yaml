---
# CAT II — Medium Severity

# V-220650: VTP password
- name: >-
    STIG | CISC-L2-000030 | V-220650 | CAT-II |
    Verify VTP password is configured
  when: stig_controls['V-220650'].run | default(false)
  tags:
    - CISC-L2-000030
    - V-220650
    - SV-220650r539671
    - cat2
    - CCI-001967
  block:
    - name: Check VTP operating mode
      cisco.ios.ios_command:
        commands:
          - "show vtp status | include VTP Operating Mode"
      register: _evaluate_vtp_mode

    - name: Check VTP password if VTP is not off
      cisco.ios.ios_command:
        commands:
          - "show vtp password"
      register: _evaluate_vtp_password
      when: '"Off" not in _evaluate_vtp_mode.stdout[0]'

    - name: Evaluate VTP password compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ stig_results | default({}) | combine({
               'V-220650': ([] if ("Off" in _evaluate_vtp_mode.stdout[0]) or
                 ("is configured" in (_evaluate_vtp_password.stdout[0] | default("")))
                 else ["VTP password not configured"])
               | network.compliance.stig_result(
                   pass_msg='VTP password is configured or VTP is off',
                   fail_msg='VTP password issue: {}')
             }) }}

# V-220651: DoS protection via QoS service-policy
- name: >-
    STIG | CISC-L2-000040 | V-220651 | CAT-II |
    Verify QoS service-policy on access ports
  when: stig_controls['V-220651'].run | default(false)
  tags:
    - CISC-L2-000040
    - V-220651
    - SV-220651r1107171
    - cat2
    - CCI-002385
  block:
    - name: Check service-policy on access port configuration
      cisco.ios.ios_command:
        commands:
          - "show run int {{ item.name }}"
      loop: "{{ compliance_access_ports }}"
      loop_control:
        label: "{{ item.name }}"
      register: _evaluate_qos

    - name: Evaluate QoS service-policy compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ _evaluate_qos.results | network.compliance.evaluate_results(
               rule_id='V-220651',
               match='service-policy',
               pass_msg='All access ports have QoS service-policy applied',
               fail_msg='Missing service-policy on: {}',
               existing_results=stig_results) }}

# V-220656: BPDU Guard on access ports
- name: >-
    STIG | CISC-L2-000100 | V-220656 | CAT-II |
    Verify BPDU Guard on access ports
  when: stig_controls['V-220656'].run | default(false)
  tags:
    - CISC-L2-000100
    - V-220656
    - SV-220656r856278
    - cat2
    - CCI-002385
  block:
    - name: Check BPDU Guard on access port configuration
      cisco.ios.ios_command:
        commands:
          - "show run int {{ item.name }}"
      loop: "{{ compliance_access_ports }}"
      loop_control:
        label: "{{ item.name }}"
      register: _evaluate_bpdu

    - name: Evaluate BPDU Guard compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ _evaluate_bpdu.results | network.compliance.evaluate_results(
               rule_id='V-220656',
               match='spanning-tree bpduguard enable',
               pass_msg='All access ports have BPDU Guard enabled',
               fail_msg='Missing BPDU Guard on: {}',
               existing_results=stig_results) }}

# V-220657: STP Loop Guard (global)
- name: >-
    STIG | CISC-L2-000110 | V-220657 | CAT-II |
    Verify STP Loop Guard is enabled globally
  when: stig_controls['V-220657'].run | default(false)
  tags:
    - CISC-L2-000110
    - V-220657
    - SV-220657r856279
    - cat2
    - CCI-002385
  block:
    - name: Check STP Loop Guard global configuration
      cisco.ios.ios_command:
        commands:
          - "show run | include spanning-tree loopguard"
      register: _evaluate_loopguard

    - name: Evaluate STP Loop Guard compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ stig_results | default({}) | combine({
               'V-220657': ([] if "loopguard default" in _evaluate_loopguard.stdout[0]
                 else ["spanning-tree loopguard default not configured"])
               | network.compliance.stig_result(
                   pass_msg='STP Loop Guard is enabled globally',
                   fail_msg='STP Loop Guard issue: {}')
             }) }}

# V-220665: UDLD (global)
- name: >-
    STIG | CISC-L2-000190 | V-220665 | CAT-II |
    Verify UDLD is enabled globally
  when: stig_controls['V-220665'].run | default(false)
  tags:
    - CISC-L2-000190
    - V-220665
    - SV-220665r539671
    - cat2
    - CCI-002385
  block:
    - name: Check UDLD global configuration
      cisco.ios.ios_command:
        commands:
          - "show run | include udld"
      register: _evaluate_udld

    - name: Evaluate UDLD compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ stig_results | default({}) | combine({
               'V-220665': ([] if "udld enable" in _evaluate_udld.stdout[0] or
                 "udld aggressive" in _evaluate_udld.stdout[0]
                 else ["UDLD not enabled globally"])
               | network.compliance.stig_result(
                   pass_msg='UDLD is enabled globally',
                   fail_msg='UDLD issue: {}')
             }) }}

# V-220666: DTP disabled on trunk ports
- name: >-
    STIG | CISC-L2-000200 | V-220666 | CAT-II |
    Verify DTP is disabled on trunk ports
  when: stig_controls['V-220666'].run | default(false)
  tags:
    - CISC-L2-000200
    - V-220666
    - SV-220666r539671
    - cat2
    - CCI-002385
  block:
    - name: Check DTP on trunk port configuration
      cisco.ios.ios_command:
        commands:
          - "show run int {{ item.name }}"
      loop: "{{ compliance_trunk_ports }}"
      loop_control:
        label: "{{ item.name }}"
      register: _evaluate_dtp

    - name: Evaluate DTP compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ _evaluate_dtp.results | network.compliance.evaluate_results(
               rule_id='V-220666',
               match='switchport nonegotiate',
               pass_msg='All trunk ports have DTP disabled',
               fail_msg='DTP enabled on trunk ports: {}',
               existing_results=stig_results) }}
