---
# CAT III — Low Severity

# V-220662: Storm control on access ports
- name: >-
    STIG | CISC-L2-000160 | V-220662 | CAT-III |
    Verify storm control on access ports
  when: stig_controls['V-220662'].run | default(false)
  tags:
    - CISC-L2-000160
    - V-220662
    - SV-220662r648766
    - cat3
    - CCI-002385
  block:
    - name: Check storm control on access port configuration
      cisco.ios.ios_command:
        commands:
          - "show run int {{ item.name }}"
      loop: "{{ compliance_access_ports }}"
      loop_control:
        label: "{{ item.name }}"
      register: _evaluate_storm

    - name: Evaluate storm control compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ _evaluate_storm.results | network.compliance.evaluate_results(
               rule_id='V-220662',
               match='storm-control broadcast',
               pass_msg='All access ports have storm control configured',
               fail_msg='Missing storm control on: {}',
               existing_results=stig_results) }}

# V-220663: IGMP Snooping (global)
- name: >-
    STIG | CISC-L2-000170 | V-220663 | CAT-III |
    Verify IGMP Snooping is enabled globally
  when: stig_controls['V-220663'].run | default(false)
  tags:
    - CISC-L2-000170
    - V-220663
    - SV-220663r929005
    - cat3
    - CCI-002385
  block:
    - name: Check IGMP Snooping global configuration
      cisco.ios.ios_command:
        commands:
          - "show run | include no ip igmp"
      register: _evaluate_igmp

    - name: Evaluate IGMP Snooping compliance
      ansible.builtin.set_fact:
        stig_results: >-
          {{ stig_results | default({}) | combine({
               'V-220663': (["IGMP snooping is disabled globally"]
                 if "no ip igmp snooping" in _evaluate_igmp.stdout[0]
                 else [])
               | network.compliance.stig_result(
                   pass_msg='IGMP Snooping is enabled globally',
                   fail_msg='IGMP Snooping issue: {}')
             }) }}
