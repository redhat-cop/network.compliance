---
- name: Resolve target platform
  ansible.builtin.set_fact:
    evaluate_platform: >-
      {{ compliance.platform | default(ansible_network_os | split('.') | last) }}

- name: Initialize stig_results
  ansible.builtin.set_fact:
    stig_results: {}

- name: Warn if no ports were discovered
  ansible.builtin.debug:
    msg: >-
      No ports discovered. Run the scan role first, or provide
      compliance_access_ports and compliance_trunk_ports via inventory.
  when: >-
    compliance_access_ports | length == 0 and
    compliance_trunk_ports | length == 0

- name: Include framework and platform evaluation tasks
  ansible.builtin.include_tasks:
    file: "{{ compliance.framework | default('stig') }}/{{ evaluate_platform }}/main.yaml"
