[tox]
env_list = lint, unit, sanity, pre-commit
skip_missing_interpreters = true

[testenv]
deps = ansible-dev-tools
skip_install = true
pass_env =
    ANSIBLE_*
    HOME

[testenv:lint]
description = Run ansible-lint and yamllint
commands =
    ansible-lint {posargs}

[testenv:unit]
description = Run unit tests for filter plugins
deps =
    ansible-dev-tools
    pytest
    pytest-ansible
commands =
    pytest tests/unit/ -v --color=yes {posargs}

[testenv:sanity]
description = Run ansible-test sanity checks
commands =
    ansible-test sanity -v --docker default {posargs}

[testenv:ruff]
description = Run ruff linter and formatter check
deps = ruff
commands =
    ruff check plugins/ tests/ {posargs}
    ruff format --check plugins/ tests/

[testenv:pre-commit]
description = Run all pre-commit hooks
deps = pre-commit
commands =
    pre-commit run --all-files {posargs}

[testenv:gitleaks]
description = Scan for secrets with gitleaks
allowlist_externals = gitleaks
commands =
    gitleaks detect --source . --config .gitleaks.toml -v

[testenv:molecule]
description = Run all Molecule scenarios
commands =
    molecule test --all {posargs}

[testenv:molecule-evaluate]
description = Run evaluate Molecule scenario
commands =
    molecule test -s evaluate-stig-ios {posargs}

[testenv:molecule-report]
description = Run report Molecule scenario
commands =
    molecule test -s report-stig-ios {posargs}

[testenv:fix]
description = Auto-fix all fixable lint and format issues
deps =
    ansible-dev-tools
    ruff
commands =
    ruff check plugins/ tests/ --fix
    ruff format plugins/ tests/
    ansible-lint --fix

[testenv:ci]
description = Run all CI checks locally (lint + unit + ruff + gitleaks)
deps =
    ansible-dev-tools
    pytest
    pytest-ansible
    ruff
    pre-commit
commands =
    ansible-lint
    ruff check plugins/ tests/
    ruff format --check plugins/ tests/
    pytest tests/unit/ -v --color=yes
